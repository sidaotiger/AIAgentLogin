<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIAgent - 登录</title>
    <style>
        :root {
            --bg-left: #383b46;
            --bg-right: #fafbfd;
            
            /* 提取参考图的表单配色 */
            --input-border: #e5e5e5;
            --input-focus-border: #4da1ff;
            --btn-primary-bg: #4da1ff;
            --text-main: #222222;
            --text-muted: #9a9a9a;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
        
        /* ✅ 修复1：手机端允许滚动，身体用 min-height 撑开 */
        body { 
            min-height: 100vh; 
            display: flex; 
            overflow-x: hidden; 
            overflow-y: auto;
        }
        
        .left-panel {
            width: 40%; background-color: var(--bg-left);
            display: flex; flex-direction: column; justify-content: space-between;
            padding: 40px 60px; position: relative; overflow: hidden;
        }

        /* ⭐ 美化的 Logo 样式 */
        .logo-area { 
            display: flex; align-items: center; gap: 12px;
            color: white; font-weight: 700; font-size: 20px; letter-spacing: 0.5px;
            z-index: 2;
        }
        .logo-icon {
            width: 34px; height: 34px; border-radius: 8px;
            background: #ffffff; display: flex; align-items: center; justify-content: center;
            color: #6d63ff; font-size: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .logo-text .highlight {
            background: linear-gradient(135deg, #6d63ff 0%, #4da1ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 800;
        }
        
        .illustration-box {
            position: absolute; bottom: 25%; left: 5%; width: 420px; height: 280px;
            display: flex; justify-content: center; align-items: flex-end;
            perspective: 600px;
        }
        
        #characters-group {
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-origin: center bottom;
            transform-style: preserve-3d;
        }
        #characters-group.stretch-neck { transform: translateY(-15px) scale(1.04); }
        #characters-group.turn-away { transform: rotateY(180deg) translateY(10px); opacity: 0.7; }

        /* ===== 角色独立动画 ===== */
        /* 小蓝 — 漂浮 */
        @keyframes float-blue {
            0%, 100% { transform: translateY(0px); }
            25%  { transform: translateY(-8px) rotate(-1deg); }
            50%  { transform: translateY(-12px) rotate(0deg); }
            75%  { transform: translateY(-4px) rotate(1deg); }
        }
        /* 小橙 — 呼吸 */
        @keyframes breathe-orange {
            0%, 100% { transform: scaleY(1) scaleX(1); }
            30%  { transform: scaleY(0.94) scaleX(1.03); }
            60%  { transform: scaleY(1.05) scaleX(0.98); }
        }
        /* 小黑 — 摇摆 */
        @keyframes sway-black {
            0%, 100% { transform: rotate(0deg) translateX(0px); }
            20%  { transform: rotate(2deg) translateX(2px); }
            40%  { transform: rotate(0deg) translateX(4px); }
            60%  { transform: rotate(-2deg) translateX(2px); }
            80%  { transform: rotate(0deg) translateX(0px); }
        }
        /* 小黄 — 弹跳 */
        @keyframes bounce-yellow {
            0%, 100% { transform: translateY(0px) scaleY(1); }
            15%  { transform: translateY(-18px) scaleY(0.85) scaleX(1.08); }
            30%  { transform: translateY(0px) scaleY(1.1) scaleX(0.95); }
            45%  { transform: translateY(-6px) scaleY(0.97); }
            55%  { transform: translateY(0px) scaleY(1.02); }
        }
        /* 眨眼 */
        @keyframes blink {
            0%, 90%, 96%, 100% { transform: scaleY(1); }
            93% { transform: scaleY(0.05); }
        }

        #char-blue   { animation: float-blue 4s ease-in-out infinite; }
        #char-orange { animation: breathe-orange 3.5s ease-in-out infinite; transform-origin: center bottom; }
        #char-black  { animation: sway-black 3s ease-in-out infinite; transform-origin: center bottom; }
        #char-yellow { animation: bounce-yellow 2.8s ease-in-out infinite; transform-origin: center bottom; }

        .eye-white { animation: blink 4s ease-in-out infinite; transform-origin: center center; }
        #char-blue .eye-white   { animation-delay: 0s; }
        #char-orange .eye-white { animation-delay: 1.3s; }
        #char-black .eye-white  { animation-delay: 2.6s; }
        #char-yellow .eye-white { animation-delay: 0.7s; }

        /* 交互时暂停角色动画 */
        #characters-group.stretch-neck #char-blue,
        #characters-group.stretch-neck #char-orange,
        #characters-group.stretch-neck #char-black,
        #characters-group.stretch-neck #char-yellow,
        #characters-group.turn-away #char-blue,
        #characters-group.turn-away #char-orange,
        #characters-group.turn-away #char-black,
        #characters-group.turn-away #char-yellow,
        #characters-group.stretch-neck .eye-white,
        #characters-group.turn-away .eye-white { animation-play-state: paused; }
        
        .footer-links { 
            color: #9ca3af; 
            font-size: 12px; 
            z-index: 2; 
        }

        /* ⭐ 右侧区域 */
        .right-panel {
            width: 60%; background-color: var(--bg-right);
            display: flex; align-items: center; justify-content: center;
            /* ✅ 修复2：在手机上留出足够的底部空间，避免被导航栏遮挡 */
            padding: 40px 20px;
        }
        .login-container {
            width: 100%; max-width: 360px; padding: 20px; text-align: center;
        }
        .login-title {
            font-size: 26px; font-weight: 700; color: var(--text-main);
            margin-bottom: 6px; letter-spacing: 1px;
        }
        .login-sub {
            font-size: 14px; color: var(--text-muted);
            margin-bottom: 35px; letter-spacing: 0.5px;
        }
        
        .input-group {
            display: flex; align-items: center;
            border: 1px solid var(--input-border); border-radius: 6px;
            padding: 0 14px; height: 46px;
            margin-bottom: 16px;
            transition: border-color 0.2s ease; background: #ffffff;
        }
        .input-group:focus-within { border-color: var(--input-focus-border); }
        .input-group .input-icon {
            color: #b0b0b0; width: 20px; height: 20px; flex-shrink: 0;
        }
        .input-group input {
            border: none; background: transparent; outline: none;
            flex: 1; height: 100%;
            font-size: 14px; color: #333333;
        }
        .input-group input::placeholder { color: #bdbdbd; }
        
        .toggle-password {
            cursor: pointer;
            transition: color 0.2s;
            margin-left: 8px;
        }
        .toggle-password:hover { color: #6c6c6c; }

        .login-btn {
            width: 100%; height: 46px; margin-top: 8px;
            border: none; border-radius: 6px;
            background: var(--btn-primary-bg); color: #ffffff;
            font-size: 16px; font-weight: 600; letter-spacing: 1px;
            cursor: pointer; transition: background 0.2s ease, transform 0.1s;
        }
        .login-btn:hover { background: #4090ee; }
        .login-btn:active { transform: scale(0.98); }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            .left-panel { width: 100%; height: 280px; padding: 20px; align-items: center; text-align: center; }
            .illustration-box { position: relative; bottom: auto; left: auto; margin: 10px auto; transform: scale(0.8); }
            .right-panel { width: 100%; padding: 30px 20px 40px; }
        }
    </style>
</head>
<body>
    <div class="left-panel">
        <div class="logo-area">
            <div class="logo-icon">
                <svg class="logo-svg" viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M13 2L3 14h6l-1 8 10-12h-6l1-8z"/></svg>
            </div>
            <span class="logo-text"><span class="highlight">AI</span>Agent</span>
        </div>

        <!-- 左侧动画小人 -->
        <div class="illustration-box">
            <svg viewBox="0 0 400 300" width="100%" height="100%" style="overflow: visible;">
                <g id="characters-group">
                    <g id="char-blue">
                        <polygon points="120,50 200,50 210,240 130,240" fill="#6d63ff" />
                        <circle cx="135" cy="85" r="9" fill="white" class="eye-white" />
                        <circle cx="185" cy="85" r="9" fill="white" class="eye-white" />
                        <circle cx="135" cy="85" r="3.5" fill="#111" class="pupil" data-range="3" />
                        <circle cx="185" cy="85" r="3.5" fill="#111" class="pupil" data-range="3" />
                    </g>
                    <g id="char-orange">
                        <path d="M 30,240 L 180,240 A 70,70 0 0 0 30,240 Z" fill="#fc8d70" />
                        <circle cx="95" cy="190" r="9" fill="white" class="eye-white" />
                        <circle cx="115" cy="190" r="9" fill="white" class="eye-white" />
                        <circle cx="95" cy="190" r="2.5" fill="#111" class="pupil" data-range="3" />
                        <circle cx="115" cy="190" r="2.5" fill="#111" class="pupil" data-range="3" />
                    </g>
                    <g id="char-black">
                        <rect x="180" y="100" width="65" height="140" rx="8" fill="#1f1f1f" />
                        <circle cx="195" cy="125" r="10" fill="white" class="eye-white" />
                        <circle cx="225" cy="125" r="10" fill="white" class="eye-white" />
                        <circle cx="195" cy="125" r="3" fill="#111" class="pupil" data-range="3" />
                        <circle cx="225" cy="125" r="3" fill="#111" class="pupil" data-range="3" />
                        <rect x="200" y="165" width="24" height="4" rx="2" fill="#111" />
                    </g>
                    <g id="char-yellow">
                        <rect x="245" y="120" width="70" height="120" rx="35" fill="#eec53e" />
                        <circle cx="265" cy="140" r="9" fill="white" class="eye-white" />
                        <circle cx="295" cy="140" r="9" fill="white" class="eye-white" />
                        <circle cx="265" cy="140" r="3" fill="#111" class="pupil" data-range="3" />
                        <circle cx="295" cy="140" r="3" fill="#111" class="pupil" data-range="3" />
                        <rect x="270" y="165" width="30" height="4" rx="2" fill="#111" />
                    </g>
                </g>
            </svg>
        </div>

        <div class="footer-links">科技改变生活</div>
    </div>

    <!-- 右侧表单 -->
    <div class="right-panel">
        <div class="login-container">
            <h1 class="login-title">AI教育</h1>
            <p class="login-sub">教育设备管理平台</p>

            <form>
                <div class="input-group">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    <input type="text" id="userInput" placeholder="用户名">
                </div>
                
                <div class="input-group">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
                    <input type="password" placeholder="密码" id="passwordInput">
                    <svg class="input-icon toggle-password" id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" onclick="togglePassword()"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </div>

                <button type="button" class="login-btn">登录</button>
            </form>
        </div>
    </div>

    <script>
        const group = document.getElementById('characters-group');
        const userInput = document.getElementById('userInput');
        const passwordInput = document.getElementById('passwordInput');
        const eyeIcon = document.getElementById('eyeIcon');

        // 1. 聚焦偷看
        const focusHandler = () => {
            if(!group.classList.contains('turn-away')) {
                group.classList.add('stretch-neck');
            }
        };
        const blurHandler = () => {
            group.classList.remove('stretch-neck');
        };
        
        userInput.addEventListener('focus', focusHandler);
        userInput.addEventListener('blur', blurHandler);
        passwordInput.addEventListener('focus', focusHandler);
        passwordInput.addEventListener('blur', blurHandler);

        // 2. 切换密码可见状态（转身逻辑）
        const eyeOpenSVG = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
        const eyeSlashSVG = '<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';

        function togglePassword() {
            const isVisible = passwordInput.getAttribute('type') === 'text';
            const newType = isVisible ? 'password' : 'text';
            passwordInput.setAttribute('type', newType);
            eyeIcon.innerHTML = newType === 'text' ? eyeSlashSVG : eyeOpenSVG;

            if (newType === 'text') {
                group.classList.remove('stretch-neck');
                group.classList.add('turn-away');
            } else {
                group.classList.remove('turn-away');
            }
        }

        // 3. 瞳孔追踪（缓存眼睛坐标，避免高频重排）
        const pupils = document.querySelectorAll('.pupil');
        let eyesCache = [];

        function updateEyesCache() {
            eyesCache = [...pupils].map(p => {
                const r = p.getBoundingClientRect();
                return {
                    cx: r.left + r.width / 2,
                    cy: r.top + r.height / 2,
                    range: parseInt(p.getAttribute('data-range')) || 3,
                    el: p
                };
            });
        }
        updateEyesCache();
        window.addEventListener('resize', updateEyesCache);

        const handleCoordMove = (clientX, clientY) => {
            if (group.classList.contains('turn-away')) return;
            eyesCache.forEach(eye => {
                let dx = clientX - eye.cx;
                let dy = clientY - eye.cy;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist > eye.range) {
                    dx = (dx / dist) * eye.range;
                    dy = (dy / dist) * eye.range;
                }
                eye.el.style.transform = `translate(${dx}px, ${dy}px)`;
            });
        };

        // 电脑端鼠标
        document.addEventListener('mousemove', (e) => {
            handleCoordMove(e.clientX, e.clientY);
        });

        // 手机端：手指落下立刻跟随
        document.addEventListener('touchstart', (e) => {
            if (e.touches && e.touches.length > 0) {
                handleCoordMove(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: true });

        // 手机端：滑动持续跟随
        document.addEventListener('touchmove', (e) => {
            if (e.touches && e.touches.length > 0) {
                handleCoordMove(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: true });
    </script>
</body>
</html>
