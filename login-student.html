<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIAgent - 登录</title>
    <style>
        :root {
            --bg: #f0f4f8;
            --card: #ffffff;
            --accent: #0EA5E9;
            --accent2: #F97316;
            --accent3: #8B5CF6;
            --green: #10B981;
            --text: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --shadow: 0 4px 24px rgba(0,0,0,0.06);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "Inter", "PingFang SC", "Microsoft YaHei", sans-serif;
            min-height: 100vh; display: flex; overflow-x: hidden;
            background: var(--bg);
            color: var(--text);
        }

        /* ===== 左侧面板 ===== */
        .left-panel {
            width: 42%; position: relative; overflow: hidden;
            background: linear-gradient(160deg, #0F172A 0%, #1E293B 40%, #1a1a2e 100%);
            display: flex; flex-direction: column; justify-content: space-between;
            padding: 40px 50px;
        }
        .left-panel::after {
            content: ''; position: absolute; top: -60%; right: -40%;
            width: 100%; height: 180%;
            background: radial-gradient(circle, rgba(14,165,233,0.08) 0%, transparent 60%),
                        radial-gradient(circle at 30% 70%, rgba(139,92,246,0.06) 0%, transparent 50%);
            pointer-events: none;
        }

        /* 装饰网格 */
        .grid-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image:
                linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none; z-index: 0;
        }

        .logo-area {
            display: flex; align-items: center; gap: 12px; z-index: 2;
            font-size: 20px; font-weight: 700; color: white;
        }
        .logo-dot {
            width: 34px; height: 34px; border-radius: 10px;
            background: linear-gradient(135deg, var(--accent), var(--accent3));
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; font-weight: 800;
        }
        .logo-text .hl {
            background: linear-gradient(135deg, var(--accent), #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .illustration-box {
            flex: 1; display: flex; align-items: center; justify-content: center;
            z-index: 1; position: relative;
        }
        #characters-group {
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-origin: center bottom;
        }
        #characters-group.stretch-neck { transform: translateY(-14px) scale(1.04); }
        #characters-group.turn-away { transform: rotateY(180deg) translateY(8px); opacity: 0.55; }

        /* 学生版角色：几何风格，有活力 */
        @keyframes levitate {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.04); }
        }
        @keyframes tilt {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(1.5deg); }
            75% { transform: rotate(-1.5deg); }
        }
        @keyframes hop {
            0%, 100% { transform: translateY(0) scaleY(1); }
            20% { transform: translateY(-20px) scaleY(0.85); }
            40% { transform: translateY(0) scaleY(1.12); }
            55% { transform: translateY(-6px); }
            70% { transform: translateY(0); }
        }
        @keyframes blinkGeom {
            0%, 88%, 95%, 100% { transform: scaleY(1); }
            91% { transform: scaleY(0.04); }
        }

        #char-a { animation: levitate 3.5s ease-in-out infinite; }
        #char-b { animation: pulse 3s ease-in-out infinite; transform-origin: center bottom; }
        #char-c { animation: tilt 3.8s ease-in-out infinite; transform-origin: center bottom; }
        #char-d { animation: hop 2.6s ease-in-out infinite; transform-origin: center bottom; }

        .eye-geom { animation: blinkGeom 4s ease-in-out infinite; transform-origin: center center; }
        #char-a .eye-geom { animation-delay: 0s; }
        #char-b .eye-geom { animation-delay: 1.2s; }
        #char-c .eye-geom { animation-delay: 2.4s; }
        #char-d .eye-geom { animation-delay: 0.6s; }

        #characters-group.stretch-neck #char-a,
        #characters-group.stretch-neck #char-b,
        #characters-group.stretch-neck #char-c,
        #characters-group.stretch-neck #char-d,
        #characters-group.turn-away #char-a,
        #characters-group.turn-away #char-b,
        #characters-group.turn-away #char-c,
        #characters-group.turn-away #char-d,
        #characters-group.stretch-neck .eye-geom,
        #characters-group.turn-away .eye-geom { animation-play-state: paused; }

        .footer-tag {
            font-size: 12px; color: rgba(255,255,255,0.3); z-index: 2;
            letter-spacing: 1px;
        }

        /* ===== 右侧表单 ===== */
        .right-panel {
            width: 58%; display: flex; align-items: center; justify-content: center;
            padding: 40px;
        }
        .login-card {
            width: 100%; max-width: 400px;
            background: var(--card); border-radius: 20px;
            padding: 48px 40px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }
        .login-title {
            font-size: 26px; font-weight: 700; color: var(--text);
            margin-bottom: 4px;
        }
        .login-sub {
            font-size: 14px; color: var(--text-muted);
            margin-bottom: 36px;
        }
        .input-row {
            display: flex; align-items: center;
            border: 1.5px solid var(--border); border-radius: 12px;
            padding: 0 16px; height: 50px; margin-bottom: 16px;
            background: #f8fafc;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .input-row:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(14,165,233,0.1);
        }
        .input-row svg { width: 20px; height: 20px; color: #94a3b8; flex-shrink: 0; }
        .input-row input {
            border: none; background: transparent; outline: none;
            flex: 1; height: 100%; padding-left: 12px;
            font-size: 15px; color: var(--text); font-family: inherit;
        }
        .input-row input::placeholder { color: #cbd5e1; }
        .toggle-password {
            cursor: pointer; color: #94a3b8; transition: color 0.2s;
            background: none; border: none; padding: 4px;
        }
        .toggle-password:hover { color: var(--accent); }
        .toggle-password svg { width: 20px; height: 20px; }

        .options-row {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 13px; color: var(--text-muted); margin: 8px 0 20px;
        }
        .options-row a { color: var(--accent); text-decoration: none; font-weight: 500; }

        .login-btn {
            width: 100%; height: 50px;
            border: none; border-radius: 12px;
            background: linear-gradient(135deg, var(--accent), #38bdf8);
            color: white; font-size: 15px; font-weight: 600;
            cursor: pointer; font-family: inherit;
            transition: transform 0.15s, box-shadow 0.2s;
            box-shadow: 0 4px 16px rgba(14,165,233,0.25);
        }
        .login-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 24px rgba(14,165,233,0.35); }
        .login-btn:active { transform: scale(0.98); }

        .alt-login {
            text-align: center; margin-top: 24px; font-size: 13px; color: var(--text-muted);
        }
        .alt-login a { color: var(--accent); text-decoration: none; font-weight: 600; }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            .left-panel { width: 100%; height: 240px; padding: 20px; }
            .illustration-box { transform: scale(0.7); }
            .right-panel { width: 100%; padding: 24px 16px; }
            .login-card { padding: 28px 22px; }
        }
    </style>
</head>
<body>
    <div class="left-panel">
        <div class="grid-bg"></div>
        <div class="logo-area">
            <div class="logo-dot">AI</div>
            <span class="logo-text"><span class="hl">AI</span>Agent</span>
        </div>

        <div class="illustration-box">
            <svg viewBox="0 0 400 320" width="100%" height="100%" style="overflow:visible;">
                <g id="characters-group">
                    <!-- 角色A：六边形 — 稳重学霸（青色） -->
                    <g id="char-a">
                        <polygon points="155,30 220,65 220,250 155,285 90,250 90,65" fill="rgba(14,165,233,0.5)" stroke="rgba(56,189,248,0.2)" stroke-width="1"/>
                        <circle cx="148" cy="80" r="8" fill="white" class="eye-geom"/>
                        <circle cx="168" cy="80" r="8" fill="white" class="eye-geom"/>
                        <circle cx="148" cy="80" r="3.5" fill="#1e293b" class="pupil" data-range="2"/>
                        <circle cx="168" cy="80" r="3.5" fill="#1e293b" class="pupil" data-range="2"/>
                    </g>
                    <!-- 角色B：半圆 — 文艺青年（紫色） -->
                    <g id="char-b">
                        <path d="M 30,260 L 175,260 A 70,80 0 0 0 30,260 Z" fill="rgba(139,92,246,0.4)" stroke="rgba(167,139,250,0.2)" stroke-width="1"/>
                        <circle cx="90" cy="200" r="8" fill="white" class="eye-geom"/>
                        <circle cx="118" cy="200" r="8" fill="white" class="eye-geom"/>
                        <circle cx="90" cy="200" r="3" fill="#1e293b" class="pupil" data-range="2"/>
                        <circle cx="118" cy="200" r="3" fill="#1e293b" class="pupil" data-range="2"/>
                    </g>
                    <!-- 角色C：细长矩 — 运动健将（绿色） -->
                    <g id="char-c">
                        <rect x="185" y="85" width="55" height="175" rx="6" fill="rgba(16,185,129,0.45)" stroke="rgba(52,211,153,0.2)" stroke-width="1"/>
                        <circle cx="200" cy="110" r="9" fill="white" class="eye-geom"/>
                        <circle cx="222" cy="110" r="9" fill="white" class="eye-geom"/>
                        <circle cx="200" cy="110" r="3.5" fill="#1e293b" class="pupil" data-range="2"/>
                        <circle cx="222" cy="110" r="3.5" fill="#1e293b" class="pupil" data-range="2"/>
                        <rect x="204" y="145" width="16" height="3" rx="1.5" fill="rgba(255,255,255,0.4)"/>
                    </g>
                    <!-- 角色D：圆角方 — 阳光学弟（橙色） -->
                    <g id="char-d">
                        <rect x="250" y="105" width="72" height="125" rx="28" fill="rgba(249,115,22,0.45)" stroke="rgba(251,146,60,0.2)" stroke-width="1"/>
                        <circle cx="272" cy="130" r="9" fill="white" class="eye-geom"/>
                        <circle cx="300" cy="130" r="9" fill="white" class="eye-geom"/>
                        <circle cx="272" cy="130" r="3.5" fill="#1e293b" class="pupil" data-range="2"/>
                        <circle cx="300" cy="130" r="3.5" fill="#1e293b" class="pupil" data-range="2"/>
                        <rect x="278" y="158" width="16" height="3" rx="1.5" fill="rgba(255,255,255,0.4)"/>
                    </g>
                </g>
            </svg>
        </div>

        <div class="footer-tag">STUDY · CREATE · SHARE</div>
    </div>

    <div class="right-panel">
        <div class="login-card">
            <h1 class="login-title">欢迎回来 👋</h1>
            <p class="login-sub">登录你的学习空间</p>
            <form>
                <div class="input-row">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    <input type="text" id="userInput" placeholder="学号 / 邮箱">
                </div>
                <div class="input-row">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
                    <input type="password" id="passwordInput" placeholder="密码">
                    <button type="button" class="toggle-password" id="eyeIcon" onclick="togglePassword()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>
                <div class="options-row">
                    <label style="display:flex;align-items:center;gap:6px;cursor:pointer;">
                        <input type="checkbox" checked style="accent-color:var(--accent);"> 记住我
                    </label>
                    <a href="#">忘记密码？</a>
                </div>
                <button type="button" class="login-btn">登 录</button>
            </form>
            <div class="alt-login">
                还没有账号？<a href="#">立即注册</a>
            </div>
        </div>
    </div>

    <script>
        const group = document.getElementById('characters-group');
        const userInput = document.getElementById('userInput');
        const passwordInput = document.getElementById('passwordInput');
        const eyeIcon = document.getElementById('eyeIcon');

        const focusHandler = () => {
            if (!group.classList.contains('turn-away')) group.classList.add('stretch-neck');
        };
        const blurHandler = () => group.classList.remove('stretch-neck');
        userInput.addEventListener('focus', focusHandler);
        userInput.addEventListener('blur', blurHandler);
        passwordInput.addEventListener('focus', focusHandler);
        passwordInput.addEventListener('blur', blurHandler);

        const eyeOpen = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
        const eyeSlash = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.5 18.5 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';

        function togglePassword() {
            const isVisible = passwordInput.getAttribute('type') === 'text';
            const newType = isVisible ? 'password' : 'text';
            passwordInput.setAttribute('type', newType);
            eyeIcon.innerHTML = newType === 'text' ? eyeSlash : eyeOpen;
            if (newType === 'text') {
                group.classList.remove('stretch-neck');
                group.classList.add('turn-away');
            } else {
                group.classList.remove('turn-away');
            }
        }

        const pupils = document.querySelectorAll('.pupil');
        let eyesCache = [];
        function updateEyesCache() {
            eyesCache = [...pupils].map(p => {
                const r = p.getBoundingClientRect();
                return { cx: r.left + r.width / 2, cy: r.top + r.height / 2, range: parseInt(p.getAttribute('data-range')) || 2, el: p };
            });
        }
        updateEyesCache();
        window.addEventListener('resize', updateEyesCache);

        const handleCoordMove = (cx, cy) => {
            if (group.classList.contains('turn-away')) return;
            eyesCache.forEach(e => {
                let dx = cx - e.cx, dy = cy - e.cy;
                const d = Math.sqrt(dx * dx + dy * dy);
                if (d > e.range) { dx = (dx / d) * e.range; dy = (dy / d) * e.range; }
                e.el.style.transform = `translate(${dx}px, ${dy}px)`;
            });
        };
        document.addEventListener('mousemove', e => handleCoordMove(e.clientX, e.clientY));
        document.addEventListener('touchstart', e => { if (e.touches[0]) handleCoordMove(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });
        document.addEventListener('touchmove', e => { if (e.touches[0]) handleCoordMove(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });
    </script>
</body>
</html>
