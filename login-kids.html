<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIAgent - 登录</title>
    <style>
        :root {
            --sky-top: #87CEEB;
            --sky-bottom: #f8e8ff;
            --card-bg: rgba(255,255,255,0.85);
            --pink: #FF6B9D;
            --purple: #C084FC;
            --yellow: #FBBF24;
            --green: #34D399;
            --blue: #60A5FA;
            --text: #4a3555;
            --text-muted: #8b7d95;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "Comic Sans MS", "KaiTi", "STKaiti", cursive, sans-serif;
            min-height: 100vh; display: flex; overflow-x: hidden;
            background: linear-gradient(180deg, var(--sky-top) 0%, #c4e4f7 30%, #f0e6ff 60%, var(--sky-bottom) 100%);
            position: relative;
        }

        /* 浮动云朵 */
        .cloud {
            position: absolute; background: white; border-radius: 50%;
            opacity: 0.8; z-index: 0;
            animation: cloudFloat 20s ease-in-out infinite;
        }
        .cloud::before, .cloud::after {
            content: ''; position: absolute; background: white; border-radius: 50%;
        }
        .cloud1 {
            width: 120px; height: 50px; top: 8%; left: 10%;
            border-radius: 25px;
            animation-delay: 0s;
        }
        .cloud1::before { width: 50px; height: 50px; top: -25px; left: 20px; }
        .cloud1::after { width: 65px; height: 60px; top: -30px; left: 50px; }
        .cloud2 {
            width: 100px; height: 40px; top: 15%; right: 15%;
            border-radius: 20px;
            animation-delay: -7s;
        }
        .cloud2::before { width: 40px; height: 40px; top: -20px; left: 15px; }
        .cloud2::after { width: 55px; height: 50px; top: -25px; left: 40px; }
        .cloud3 {
            width: 90px; height: 35px; top: 60%; left: 5%;
            border-radius: 18px;
            animation-delay: -13s;
        }
        .cloud3::before { width: 35px; height: 35px; top: -18px; left: 12px; }
        .cloud3::after { width: 45px; height: 42px; top: -22px; left: 35px; }
        @keyframes cloudFloat {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(30px); }
            50% { transform: translateX(-10px); }
            75% { transform: translateX(20px); }
        }

        /* 浮动星星 */
        .star {
            position: absolute; z-index: 1;
            animation: starTwinkle 2s ease-in-out infinite;
            font-size: 24px;
        }
        @keyframes starTwinkle {
            0%, 100% { transform: scale(1) rotate(0deg); opacity: 0.6; }
            50% { transform: scale(1.3) rotate(15deg); opacity: 1; }
        }

        /* ===== 左侧面板 ===== */
        .left-panel {
            width: 42%; position: relative; z-index: 2;
            display: flex; flex-direction: column; justify-content: space-between;
            padding: 36px 40px;
        }
        .logo-area {
            display: flex; align-items: center; gap: 10px; z-index: 3;
            font-size: 22px; font-weight: 800; color: var(--text);
        }
        .logo-icon {
            width: 42px; height: 42px; border-radius: 14px;
            background: linear-gradient(135deg, var(--pink), var(--purple));
            display: flex; align-items: center; justify-content: center;
            font-size: 22px;
            box-shadow: 0 4px 15px rgba(192,132,252,0.4);
        }
        .logo-highlight {
            background: linear-gradient(135deg, var(--pink), var(--purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .illustration-box {
            flex: 1; display: flex; align-items: center; justify-content: center;
            z-index: 1; position: relative;
        }
        #characters-group {
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-origin: center bottom;
        }
        #characters-group.stretch-neck { transform: translateY(-12px) scale(1.05); }
        #characters-group.turn-away { transform: rotateY(180deg); opacity: 0.5; }

        /* 儿童版角色动画 */
        @keyframes bouncePink {
            0%, 100% { transform: translateY(0); }
            30% { transform: translateY(-22px); }
            50% { transform: translateY(0); }
            70% { transform: translateY(-10px); }
            85% { transform: translateY(0); }
        }
        @keyframes wiggleGreen {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(4deg); }
            50% { transform: rotate(0deg); }
            75% { transform: rotate(-4deg); }
        }
        @keyframes bounceBlue {
            0%, 100% { transform: translateY(0) scaleY(1); }
            20% { transform: translateY(-16px) scaleY(0.8) scaleX(1.1); }
            40% { transform: translateY(2px) scaleY(1.15) scaleX(0.9); }
            60% { transform: translateY(-6px); }
            75% { transform: translateY(0); }
        }
        @keyframes danceYellow {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            15% { transform: translateY(-14px) rotate(-3deg); }
            30% { transform: translateY(0) rotate(0deg); }
            45% { transform: translateY(-14px) rotate(3deg); }
            60% { transform: translateY(0) rotate(0deg); }
        }
        @keyframes blinkBig {
            0%, 88%, 95%, 100% { transform: scaleY(1); }
            91% { transform: scaleY(0.03); }
        }
        @keyframes smileBounce {
            0%, 100% { transform: scaleX(1); }
            50% { transform: scaleX(1.15); }
        }

        #char-pink   { animation: bouncePink 2.2s ease-in-out infinite; transform-origin: center bottom; }
        #char-green  { animation: wiggleGreen 2.8s ease-in-out infinite; transform-origin: center bottom; }
        #char-blue-k { animation: bounceBlue 2.5s ease-in-out infinite; transform-origin: center bottom; }
        #char-yellow-k { animation: danceYellow 2s ease-in-out infinite; transform-origin: center bottom; }

        .eye-kids { animation: blinkBig 3.5s ease-in-out infinite; transform-origin: center center; }
        #char-pink .eye-kids    { animation-delay: 0s; }
        #char-green .eye-kids   { animation-delay: 1s; }
        #char-blue-k .eye-kids  { animation-delay: 2s; }
        #char-yellow-k .eye-kids { animation-delay: 0.6s; }

        .mouth-kids { animation: smileBounce 3s ease-in-out infinite; transform-origin: center center; }

        #characters-group.stretch-neck #char-pink,
        #characters-group.stretch-neck #char-green,
        #characters-group.stretch-neck #char-blue-k,
        #characters-group.stretch-neck #char-yellow-k,
        #characters-group.turn-away #char-pink,
        #characters-group.turn-away #char-green,
        #characters-group.turn-away #char-blue-k,
        #characters-group.turn-away #char-yellow-k,
        #characters-group.stretch-neck .eye-kids,
        #characters-group.turn-away .eye-kids { animation-play-state: paused; }

        .footer-text {
            font-size: 14px; color: var(--text-muted); z-index: 3;
            text-align: center;
        }

        /* ===== 右侧表单 ===== */
        .right-panel {
            width: 58%; display: flex; align-items: center; justify-content: center;
            z-index: 2; padding: 40px;
        }
        .login-card {
            width: 100%; max-width: 380px;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: 28px;
            padding: 44px 36px;
            box-shadow: 0 8px 40px rgba(160,100,200,0.12);
            text-align: center;
        }
        .login-title {
            font-size: 30px; font-weight: 800; color: var(--text); margin-bottom: 4px;
        }
        .login-sub {
            font-size: 15px; color: var(--text-muted); margin-bottom: 32px;
        }
        .input-group {
            display: flex; align-items: center;
            background: #f8f4ff; border-radius: 16px;
            padding: 0 16px; height: 50px; margin-bottom: 16px;
            border: 2px solid transparent;
            transition: border-color 0.2s;
        }
        .input-group:focus-within { border-color: var(--purple); }
        .input-group svg { width: 22px; height: 22px; color: #c4b5d0; flex-shrink: 0; }
        .input-group input {
            border: none; background: transparent; outline: none;
            flex: 1; height: 100%; padding-left: 12px;
            font-size: 16px; color: var(--text); font-family: inherit;
        }
        .input-group input::placeholder { color: #c4b5d0; }
        .toggle-password {
            cursor: pointer; color: #c4b5d0; transition: color 0.2s;
            background: none; border: none; padding: 4px;
        }
        .toggle-password:hover { color: var(--purple); }
        .toggle-password svg { width: 22px; height: 22px; }

        .login-btn {
            width: 100%; height: 52px; margin-top: 10px;
            border: none; border-radius: 16px;
            background: linear-gradient(135deg, var(--pink), var(--purple));
            color: white; font-size: 18px; font-weight: 700;
            cursor: pointer; font-family: inherit;
            transition: transform 0.15s, box-shadow 0.2s;
            box-shadow: 0 6px 24px rgba(192,132,252,0.35);
        }
        .login-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(192,132,252,0.5); }
        .login-btn:active { transform: scale(0.96); }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            .left-panel { width: 100%; height: 260px; padding: 20px; }
            .illustration-box { transform: scale(0.7); }
            .right-panel { width: 100%; padding: 20px; }
            .login-card { padding: 28px 22px; border-radius: 22px; }
        }
    </style>
</head>
<body>
    <!-- 装饰元素 -->
    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>
    <div class="cloud cloud3"></div>
    <div class="star" style="top:12%;left:25%;animation-delay:0s;">⭐</div>
    <div class="star" style="top:20%;right:20%;animation-delay:0.7s;">✨</div>
    <div class="star" style="top:55%;left:8%;animation-delay:1.4s;">🌟</div>
    <div class="star" style="top:70%;right:10%;animation-delay:0.3s;">⭐</div>
    <div class="star" style="top:35%;left:45%;animation-delay:1s;">💫</div>

    <div class="left-panel">
        <div class="logo-area">
            <div class="logo-icon">🌈</div>
            <span><span class="logo-highlight">AI</span> 小伙伴</span>
        </div>

        <div class="illustration-box">
            <svg viewBox="0 0 400 320" width="100%" height="100%" style="overflow:visible;">
                <g id="characters-group">
                    <!-- 小粉 — 最大最可爱 -->
                    <g id="char-pink">
                        <ellipse cx="155" cy="140" rx="75" ry="95" fill="#FF6B9D"/>
                        <ellipse cx="155" cy="135" rx="55" ry="68" fill="#FF8DB5"/>
                        <circle cx="130" cy="115" r="14" fill="white" class="eye-kids"/>
                        <circle cx="178" cy="115" r="14" fill="white" class="eye-kids"/>
                        <circle cx="132" cy="115" r="6" fill="#4a3555" class="pupil" data-range="2"/>
                        <circle cx="180" cy="115" r="6" fill="#4a3555" class="pupil" data-range="2"/>
                        <circle cx="132" cy="113" r="2" fill="white"/>
                        <circle cx="180" cy="113" r="2" fill="white"/>
                        <ellipse cx="155" cy="148" rx="12" ry="7" fill="#4a3555" class="mouth-kids" opacity="0.6"/>
                        <ellipse cx="138" cy="175" rx="18" ry="12" fill="#FF8DB5" opacity="0.5"/>
                        <ellipse cx="172" cy="175" rx="18" ry="12" fill="#FF8DB5" opacity="0.5"/>
                    </g>
                    <!-- 小绿 — 矮胖可爱 -->
                    <g id="char-green">
                        <ellipse cx="55" cy="230" rx="65" ry="55" fill="#34D399"/>
                        <ellipse cx="55" cy="222" rx="48" ry="38" fill="#6EE7B7"/>
                        <circle cx="36" cy="210" r="12" fill="white" class="eye-kids"/>
                        <circle cx="68" cy="210" r="12" fill="white" class="eye-kids"/>
                        <circle cx="38" cy="210" r="5" fill="#4a3555" class="pupil" data-range="2"/>
                        <circle cx="70" cy="210" r="5" fill="#4a3555" class="pupil" data-range="2"/>
                        <circle cx="38" cy="208" r="1.8" fill="white"/>
                        <circle cx="70" cy="208" r="1.8" fill="white"/>
                        <ellipse cx="55" cy="238" rx="9" ry="5" fill="#4a3555" class="mouth-kids" opacity="0.5"/>
                    </g>
                    <!-- 小蓝 — 瘦高聪明 -->
                    <g id="char-blue-k">
                        <rect x="190" y="80" width="85" height="165" rx="42" fill="#60A5FA"/>
                        <rect x="205" y="95" width="55" height="135" rx="28" fill="#93C5FD"/>
                        <circle cx="218" cy="115" r="12" fill="white" class="eye-kids"/>
                        <circle cx="248" cy="115" r="12" fill="white" class="eye-kids"/>
                        <circle cx="220" cy="115" r="5" fill="#4a3555" class="pupil" data-range="2"/>
                        <circle cx="250" cy="115" r="5" fill="#4a3555" class="pupil" data-range="2"/>
                        <circle cx="220" cy="113" r="1.8" fill="white"/>
                        <circle cx="250" cy="113" r="1.8" fill="white"/>
                        <ellipse cx="235" cy="150" rx="10" ry="6" fill="#4a3555" class="mouth-kids" opacity="0.5"/>
                        <rect x="222" y="185" width="25" height="30" rx="12" fill="#93C5FD" opacity="0.5"/>
                    </g>
                    <!-- 小黄 — 最活泼 -->
                    <g id="char-yellow-k">
                        <ellipse cx="300" cy="155" rx="55" ry="70" fill="#FBBF24"/>
                        <ellipse cx="300" cy="150" rx="40" ry="50" fill="#FDE68A"/>
                        <circle cx="282" cy="132" r="12" fill="white" class="eye-kids"/>
                        <circle cx="315" cy="132" r="12" fill="white" class="eye-kids"/>
                        <circle cx="284" cy="132" r="5" fill="#4a3555" class="pupil" data-range="2"/>
                        <circle cx="317" cy="132" r="5" fill="#4a3555" class="pupil" data-range="2"/>
                        <circle cx="284" cy="130" r="1.8" fill="white"/>
                        <circle cx="317" cy="130" r="1.8" fill="white"/>
                        <ellipse cx="300" cy="160" rx="9" ry="5" fill="#4a3555" class="mouth-kids" opacity="0.5"/>
                    </g>
                </g>
            </svg>
        </div>

        <div class="footer-text">🎨 学习很快乐！</div>
    </div>

    <div class="right-panel">
        <div class="login-card">
            <h1 class="login-title">👋 嗨，小朋友！</h1>
            <p class="login-sub">快来一起探索奇妙世界吧</p>
            <form>
                <div class="input-group">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    <input type="text" id="userInput" placeholder="你的昵称">
                </div>
                <div class="input-group">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
                    <input type="password" id="passwordInput" placeholder="秘密密码">
                    <button type="button" class="toggle-password" id="eyeIcon" onclick="togglePassword()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>
                <button type="button" class="login-btn">🎈 出发！</button>
            </form>
        </div>
    </div>

    <script>
        const group = document.getElementById('characters-group');
        const userInput = document.getElementById('userInput');
        const passwordInput = document.getElementById('passwordInput');
        const eyeIcon = document.getElementById('eyeIcon');

        const focusHandler = () => {
            if (!group.classList.contains('turn-away')) group.classList.add('stretch-neck');
        };
        const blurHandler = () => group.classList.remove('stretch-neck');
        userInput.addEventListener('focus', focusHandler);
        userInput.addEventListener('blur', blurHandler);
        passwordInput.addEventListener('focus', focusHandler);
        passwordInput.addEventListener('blur', blurHandler);

        const eyeOpen = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
        const eyeSlash = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.5 18.5 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';

        function togglePassword() {
            const isVisible = passwordInput.getAttribute('type') === 'text';
            const newType = isVisible ? 'password' : 'text';
            passwordInput.setAttribute('type', newType);
            eyeIcon.innerHTML = newType === 'text' ? eyeSlash : eyeOpen;
            if (newType === 'text') {
                group.classList.remove('stretch-neck');
                group.classList.add('turn-away');
            } else {
                group.classList.remove('turn-away');
            }
        }

        const pupils = document.querySelectorAll('.pupil');
        let eyesCache = [];
        function updateEyesCache() {
            eyesCache = [...pupils].map(p => {
                const r = p.getBoundingClientRect();
                return { cx: r.left + r.width / 2, cy: r.top + r.height / 2, range: parseInt(p.getAttribute('data-range')) || 2, el: p };
            });
        }
        updateEyesCache();
        window.addEventListener('resize', updateEyesCache);

        const handleCoordMove = (cx, cy) => {
            if (group.classList.contains('turn-away')) return;
            eyesCache.forEach(e => {
                let dx = cx - e.cx, dy = cy - e.cy;
                const d = Math.sqrt(dx * dx + dy * dy);
                if (d > e.range) { dx = (dx / d) * e.range; dy = (dy / d) * e.range; }
                e.el.style.transform = `translate(${dx}px, ${dy}px)`;
            });
        };
        document.addEventListener('mousemove', e => handleCoordMove(e.clientX, e.clientY));
        document.addEventListener('touchstart', e => { if (e.touches[0]) handleCoordMove(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });
        document.addEventListener('touchmove', e => { if (e.touches[0]) handleCoordMove(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });
    </script>
</body>
</html>
